# Alembic configuration for the Eign service (schema `eign`).
#
# Eign keeps its own migration chain so it does not interfere with the root
# migrations that manage the `logos` schema of the same database. The version
# table is `alembic_version_eign` (see alembic/env.py).
#
# Run from the `eign/` directory:
#   alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# The URL is built in alembic/env.py from POSTGRES_* (migrations run as a
# superuser because they create the schema, the roles and their grants).
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
