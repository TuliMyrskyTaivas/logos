openapi: 3.2.0
info:
  title: Eign Portfolio API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - service
      summary: Liveness probe
      description: Report that the service process is running (used by healthchecks).
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/me:
    get:
      tags:
      - auth
      summary: Read Current User
      description: 'Return the authenticated user.


        The first request creates the very first user with the `admin` role.'
      operationId: read_current_user_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
      - auth
      summary: Update own settings
      description: 'Change the caller''s base currency and risk-free rate.


        Both fields are optional; an explicit `null` risk-free rate restores the

        service-wide default.'
      operationId: update_own_settings_auth_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users:
    get:
      tags:
      - users
      summary: List users
      description: Return all users, including deactivated ones.
      operationId: list_users_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
                title: Response List Users Users Get
    post:
      tags:
      - users
      summary: Create a user
      description: Register a new user. Certificates are issued by an external CA.
      operationId: create_user_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{userId}:
    patch:
      tags:
      - users
      summary: Update a user
      description: 'Change the role or the activation status of a user.


        Administrators may edit their own record, but the service always keeps at

        least one active administrator.'
      operationId: update_user_users__userId__patch
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          title: Userid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Deactivate a user
      description: 'Soft-delete a user: portfolio history is kept, sign-in is blocked.'
      operationId: delete_user_users__userId__delete
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          title: Userid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /asset-classes:
    get:
      tags:
      - asset-classes
      summary: List asset classes
      description: Return the asset class dictionary used by positions and plans.
      operationId: list_asset_classes_asset_classes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssetClassInfo'
                type: array
                title: Response List Asset Classes Asset Classes Get
  /assets:
    get:
      tags:
      - assets
      summary: List positions
      description: Return the current user's positions, optionally filtered by class.
      operationId: list_assets_assets_get
      parameters:
      - name: assetClassId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assetclassid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
                title: Response List Assets Assets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - assets
      summary: Create a position
      description: Create a position. Its quantity may be set manually while it has no trades.
      operationId: create_asset_assets_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/{assetId}:
    get:
      tags:
      - assets
      summary: Get a position
      description: Return one of the current user's positions.
      operationId: get_asset_assets__assetId__get
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          title: Assetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - assets
      summary: Update a position
      description: 'Update a position.


        Quantity and average purchase price are derived from trades, so they can

        only be changed while the position has no trades.'
      operationId: update_asset_assets__assetId__patch
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          title: Assetid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - assets
      summary: Delete a position
      description: Delete a position together with its trade history (database cascade).
      operationId: delete_asset_assets__assetId__delete
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          title: Assetid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /trades:
    get:
      tags:
      - trades
      summary: List trades
      description: Return the current user's trades, newest first.
      operationId: list_trades_trades_get
      parameters:
      - name: assetId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assetid
      - name: tradeType
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - BUY
            - SELL
            type: string
          - type: 'null'
          title: Tradetype
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
                title: Response List Trades Trades Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - trades
      summary: Register a trade
      description: Register a buy or sell and recalculate the position.
      operationId: create_trade_trades_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /trades/{tradeId}:
    patch:
      tags:
      - trades
      summary: Correct a trade
      description: Correct a trade; the whole position is recalculated afterwards.
      operationId: update_trade_trades__tradeId__patch
      parameters:
      - name: tradeId
        in: path
        required: true
        schema:
          type: integer
          title: Tradeid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - trades
      summary: Delete a trade
      description: Delete a trade and recalculate the position from the remaining ones.
      operationId: delete_trade_trades__tradeId__delete
      parameters:
      - name: tradeId
        in: path
        required: true
        schema:
          type: integer
          title: Tradeid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /trade-plan:
    get:
      tags:
      - trade-plan
      summary: List planned trades
      description: Return planned trades of the current user with their month progress.
      operationId: list_trade_plan_trade_plan_get
      parameters:
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Month
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - planned
            - executed
            - cancelled
            type: string
          - type: 'null'
          title: Status
      - name: assetClassId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assetclassid
      - name: assetId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assetid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradePlan'
                title: Response List Trade Plan Trade Plan Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - trade-plan
      summary: Plan a trade
      description: Plan a purchase or sale of a whole asset class or of one position.
      operationId: create_trade_plan_trade_plan_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradePlanCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /trade-plan/{planId}:
    patch:
      tags:
      - trade-plan
      summary: Change a planned trade
      description: Update a planned trade; the target may be switched between class and asset.
      operationId: update_trade_plan_trade_plan__planId__patch
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: integer
          title: Planid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradePlanUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - trade-plan
      summary: Delete a planned trade
      description: Delete a planned trade.
      operationId: delete_trade_plan_trade_plan__planId__delete
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: integer
          title: Planid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /prices:
    post:
      tags:
      - prices
      summary: Enter a quote manually
      description: Store a manual quote; it takes precedence over fetched quotes of that day.
      operationId: create_manual_price_prices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portfolio/summary:
    get:
      tags:
      - portfolio
      summary: Value the portfolio
      description: 'Value the current user''s positions at the latest known prices.


        Market cache first, then the manually maintained `currentPrice` of the

        position. Values are converted to the user''s base currency with CBR rates.'
      operationId: get_portfolio_summary_portfolio_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
  /portfolio/performance:
    get:
      tags:
      - portfolio
      summary: Portfolio performance and risk metrics
      description: Compute time- and money-weighted metrics from the stored snapshots.
      operationId: get_portfolio_performance_portfolio_performance_get
      parameters:
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      - name: riskFreeRate
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 10.0
            minimum: -1.0
          - type: 'null'
          description: Annual risk-free rate; defaults to settings.
          title: Riskfreerate
        description: Annual risk-free rate; defaults to settings.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /valuations:
    get:
      tags:
      - valuations
      summary: List stored valuations
      description: Return the current user's snapshots, newest first.
      operationId: list_valuations_valuations_get
      parameters:
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 240
          minimum: 1
          default: 24
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valuation'
                title: Response List Valuations Valuations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /valuations/latest:
    get:
      tags:
      - valuations
      summary: Get the latest valuation
      description: Return the most recent stored snapshot of the current user.
      operationId: get_latest_valuation_valuations_latest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
  /goals:
    get:
      tags:
      - goals
      summary: Get portfolio goals
      description: Return the goals of the current user; an empty goal when none are set.
      operationId: read_goals_goals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
    put:
      tags:
      - goals
      summary: Save portfolio goals
      description: 'Create or replace the goals of the current user.


        Allocations are replaced entirely, so the payload is the full target

        distribution. Non-empty weights must sum to 100 %.'
      operationId: save_goals_goals_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /goals/progress:
    get:
      tags:
      - goals
      summary: Progress towards the goals
      description: Compare the current portfolio with the target value, weights and return.
      operationId: get_goal_progress_goals_progress_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProgress'
  /income:
    get:
      tags:
      - income
      summary: List income plan/fact rows
      description: Return income rows, newest month first.
      operationId: list_income_income_get
      parameters:
      - name: assetId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assetid
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      - name: incomeType
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - dividend
            - coupon
            - interest
            - other
            type: string
          - type: 'null'
          title: Incometype
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomePlanFact'
                title: Response List Income Income Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - income
      summary: Add an income row
      description: Record planned and/or actual income of a position for a month.
      operationId: create_income_income_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomePlanFact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /income/summary:
    get:
      tags:
      - income
      summary: Plan/fact summary by month
      description: Return plan/fact totals per month of a year in the base currency.
      operationId: get_income_summary_income_summary_get
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2200
            minimum: 2000
          - type: 'null'
          title: Year
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /income/{incomeId}:
    patch:
      tags:
      - income
      summary: Correct an income row
      description: Change amounts or details of an income row.
      operationId: update_income_income__incomeId__patch
      parameters:
      - name: incomeId
        in: path
        required: true
        schema:
          type: integer
          title: Incomeid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomePlanFact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - income
      summary: Delete an income row
      description: Delete an income row.
      operationId: delete_income_income__incomeId__delete
      parameters:
      - name: incomeId
        in: path
        required: true
        schema:
          type: integer
          title: Incomeid
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Asset:
      properties:
        id:
          type: integer
          title: Id
          description: Database identifier.
        assetClassId:
          type: integer
          title: Assetclassid
          description: Asset class identifier.
        assetClassCode:
          type: string
          title: Assetclasscode
          description: Asset class code (EQUITY, BOND, ...).
        name:
          type: string
          title: Name
          description: Position name.
        ticker:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticker
          description: Exchange ticker.
        isin:
          anyOf:
          - type: string
          - type: 'null'
          title: Isin
          description: ISIN code.
        metalCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Metalcode
          description: Metal code for METAL positions (XAU, XAG, ...).
        currency:
          type: string
          title: Currency
          description: Currency of the position.
        quantity:
          type: number
          title: Quantity
          description: Units held; derived from trades.
        unit:
          type: string
          enum:
          - share
          - bond
          - unit
          - RUB
          - g
          - oz
          title: Unit
          description: Unit of the quantity.
        avgPurchasePrice:
          anyOf:
          - type: number
          - type: 'null'
          title: Avgpurchaseprice
          description: Weighted average cost per unit, or null.
        currentPrice:
          anyOf:
          - type: number
          - type: 'null'
          title: Currentprice
          description: Last known price per unit, or null.
        custodian:
          anyOf:
          - type: string
          - type: 'null'
          title: Custodian
          description: Broker or storage.
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: Creation timestamp.
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: Last modification timestamp.
      type: object
      required:
      - id
      - assetClassId
