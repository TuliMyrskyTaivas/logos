services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mimir:
    image: registry.ice-castle.ru/mimir:latest
    build:
      context: .
      dockerfile: "mímir/Dockerfile"
    restart: unless-stopped
    environment:
      MIMIR_HOST: "0.0.0.0"
      MIMIR_PORT: "8443"
      MIMIR_DB_HOST: db
      MIMIR_DB_PORT: "5432"
      MIMIR_DB_NAME: "${POSTGRES_DB}"
      MIMIR_DB_USER: "${POSTGRES_USER}"
      MIMIR_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      # Credentials used by the Alembic migrations (root database.py reads POSTGRES_*).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      IMPORTER_PASSWORD: "${IMPORTER_PASSWORD}"
      ANALYST_PASSWORD: "${ANALYST_PASSWORD}"
      # Server TLS is enabled when MIMIR_SERVER_CERT_FILE and MIMIR_SERVER_KEY_FILE are set.
      # Client certificates are verified by nginx on the host.
      # MIMIR_SERVER_CERT_FILE: "/certs/mimir_cert.crt"
      # MIMIR_SERVER_KEY_FILE: "/certs/mimir_key.crt"
    ports:
      - '8443:8443'
    volumes:
      - ./mímir/certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
